<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <meta name="theme-color" content="#eef0f6">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #16171b;
      background: radial-gradient(1000px 520px at 15% -10%, #e4e2ff, transparent 60%),
                  radial-gradient(900px 520px at 100% 110%, #f1e4ff, transparent 60%), #f3f4f8; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      padding: 16px; box-sizing: border-box; }
    #chat { width: 100%; max-width: 560px; height: min(760px, calc(100% - 40px)); border-radius: 22px; overflow: hidden;
      background: #fff; box-shadow: 0 30px 70px -20px rgba(30, 27, 75, .35), 0 0 0 1px rgba(0, 0, 0, .04);
      animation: in .5s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes in { from { opacity: 0; transform: translateY(16px) scale(.98); } }
    .made { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #80858f; text-decoration: none; }
    .made:hover { color: #4f46e5; }
    .made img { width: 18px; height: 18px; }
    .error { color: #b42318; background: #fff; padding: 16px 20px; border-radius: 14px; max-width: 480px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .25); }
    @media (max-width: 600px) { .wrap { padding: 0; gap: 0; } #chat { height: 100%; border-radius: 0; } .made { display: none; } }
    @media (prefers-color-scheme: dark) {
      body { background: radial-gradient(1000px 520px at 15% -10%, #23233a, transparent 60%), #111; }
      .made { color: #8a8a8a; }
    }
    @media (prefers-reduced-motion: reduce) { #chat { animation: none; } }
  </style>
</head>
<body>
  <div class="wrap"><div id="chat"></div>
    <a class="made" href="/" title="Abrir la consola"><img src="favicon.svg" alt="">Hecho con Lince</a>
  </div>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var agent = p.get("agent");
      var wrap = document.querySelector(".wrap");
      function fail(msg) {
        var d = document.createElement("div");
        d.className = "error";
        d.textContent = msg;
        wrap.textContent = "";
        wrap.appendChild(d);
      }
      if (!agent) { fail("Falta el parámetro ?agent= en la dirección."); return; }
      fetch("/api/agents/" + encodeURIComponent(agent) + "/public")
        .then(function (r) { if (!r.ok) throw new Error("No existe el agente «" + agent + "»."); return r.json(); })
        .then(function (info) {
          document.title = info.name;
          document.documentElement.lang = info.language;
          var s = document.createElement("script");
          s.src = "/widget.js";
          s.dataset.agent = info.id;
          s.dataset.inline = "#chat";
          s.dataset.title = p.get("title") || info.name;
          if (p.get("color")) s.dataset.color = p.get("color");
          if (p.get("key")) s.dataset.key = p.get("key");
          if (info.language === "en") s.dataset.placeholder = "Type a message…";
          document.body.appendChild(s);
        })
        .catch(function (e) { fail(e.message); });
    })();
  </script>
</body>
</html>
