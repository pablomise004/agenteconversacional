<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234361ee'/%3E%3Cpath d='M9 11h14M9 16h9M9 21h6' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    html, body { height: 100%; margin: 0; background: #e9ecf3; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .wrap { height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
    #chat { width: 100%; max-width: 560px; height: min(760px, 100%); border-radius: 16px; overflow: hidden;
      box-shadow: 0 12px 40px rgba(20, 30, 55, .18); background: #fff; }
    .error { color: #b42318; background: #fff; padding: 16px 20px; border-radius: 12px; max-width: 480px; }
    @media (max-width: 600px) { .wrap { padding: 0; } #chat { height: 100%; border-radius: 0; } }
  </style>
</head>
<body>
  <div class="wrap"><div id="chat"></div></div>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var agent = p.get("agent");
      var wrap = document.querySelector(".wrap");
      function fail(msg) {
        var d = document.createElement("div");
        d.className = "error";
        d.textContent = msg;
        wrap.textContent = "";
        wrap.appendChild(d);
      }
      if (!agent) { fail("Falta el parámetro ?agent= en la dirección."); return; }
      fetch("/api/agents/" + encodeURIComponent(agent) + "/public")
        .then(function (r) { if (!r.ok) throw new Error("No existe el agente «" + agent + "»."); return r.json(); })
        .then(function (info) {
          document.title = info.name;
          document.documentElement.lang = info.language;
          var s = document.createElement("script");
          s.src = "/widget.js";
          s.dataset.agent = info.id;
          s.dataset.inline = "#chat";
          s.dataset.title = p.get("title") || info.name;
          if (p.get("color")) s.dataset.color = p.get("color");
          if (p.get("key")) s.dataset.key = p.get("key");
          if (info.language === "en") s.dataset.placeholder = "Type a message…";
          document.body.appendChild(s);
        })
        .catch(function (e) { fail(e.message); });
    })();
  </script>
</body>
</html>
