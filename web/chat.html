<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat · Lince</title>
  <meta name="description" content="Chatea con un agente hecho con Lince, la alternativa libre a Dialogflow para crear chatbots en español.">
  <!-- cada chat es de un agente de alguien: no se indexa -->
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lince">
  <meta property="og:title" content="Chat · Lince">
  <meta property="og:description" content="Chatea con un agente hecho con Lince, la alternativa libre a Dialogflow para crear chatbots en español.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#eef0f6">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // antes de pintar: tema (?theme=, si no el elegido en Lince, si no el del sistema) y si va en un iframe
    (function () {
      var d = document.documentElement, framed = true, t = null;
      try { framed = window.self !== window.top; } catch (e) {}
      if (framed) d.dataset.embedded = "";
      var p = new URLSearchParams(location.search).get("theme");
      if (p === "light" || p === "dark") t = p;
      else if (!framed && p !== "auto") { try { t = localStorage.getItem("agente.theme"); } catch (e) {} }
      if (t === "light" || t === "dark") d.dataset.theme = t;
    })();
  </script>
  <style>
    :root { --page: #f3f4f8; --glow-1: #e4e2ff; --glow-2: #f1e4ff; --card: #fff; --text: #16171b; --muted: #4f5463;
      --line: #e7e8eb; --hover: rgba(255, 255, 255, .75); --accent: #4f46e5; --danger: #b42318;
      --shadow: 0 30px 70px -20px rgba(30, 27, 75, .35), 0 0 0 1px rgba(0, 0, 0, .04); color-scheme: light; }
    /* oscuro si el sistema lo pide (salvo ?theme=light o el tema claro elegido) o con ?theme=dark */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --page: #111; --glow-1: #23233a; --glow-2: #1b1b24; --card: #1c1c1c; --text: #ececec;
        --muted: #a3a3a3; --line: #303030; --hover: #1c1c1c; --accent: #a5b4fc; --danger: #f87171;
        --shadow: 0 30px 70px -20px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .07); color-scheme: dark; }
    }
    :root[data-theme="dark"] { --page: #111; --glow-1: #23233a; --glow-2: #1b1b24; --card: #1c1c1c; --text: #ececec;
      --muted: #a3a3a3; --line: #303030; --hover: #1c1c1c; --accent: #a5b4fc; --danger: #f87171;
      --shadow: 0 30px 70px -20px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .07); color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text);
      background: radial-gradient(1000px 520px at 15% -10%, var(--glow-1), transparent 60%),
                  radial-gradient(900px 520px at 100% 110%, var(--glow-2), transparent 60%), var(--page); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; border: 0; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      padding: 16px; box-sizing: border-box; }
    #chat { width: 100%; max-width: 560px; height: min(760px, calc(100% - 96px)); border-radius: 22px; overflow: hidden;
      background: var(--card); box-shadow: var(--shadow); animation: in .5s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes in { from { opacity: 0; transform: translateY(16px) scale(.98); } }

    /* «Volver» y el cambio de tema (no salen dentro de un iframe) */
    .bar { width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: space-between;
      animation: in .5s cubic-bezier(.2, .8, .2, 1) both; }
    [data-embedded] .bar { display: none; }
    [data-embedded] #chat { height: min(760px, calc(100% - 40px)); }
    .bar-btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px 0 9px; border-radius: 10px;
      border: 1px solid transparent; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600;
      text-decoration: none; cursor: pointer; transition: background-color .15s, color .15s, border-color .15s; }
    .bar-btn:hover { background: var(--hover); border-color: var(--line); color: var(--text); }
    .bar-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .bar-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
      stroke-linejoin: round; flex: none; transition: transform .3s cubic-bezier(.34, 1.45, .64, 1), opacity .2s; }
    .back:hover svg { transform: translateX(-3px); }
    .theme { display: inline-grid; place-items: center; width: 36px; padding: 0; }
    .theme svg { grid-area: 1 / 1; }
    .theme:hover svg { transform: rotate(-14deg); }
    /* luna en claro (para pasar a oscuro) y sol en oscuro */
    .theme .i-sun, :root[data-theme="dark"] .theme .i-moon { opacity: 0; transform: rotate(-90deg) scale(.5); }
    :root[data-theme="dark"] .theme .i-sun { opacity: 1; transform: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme .i-moon { opacity: 0; transform: rotate(-90deg) scale(.5); }
      :root:not([data-theme="light"]) .theme .i-sun { opacity: 1; transform: none; }
    }
    /* el tema nuevo aparece en un círculo que crece desde el botón (como en la consola) */
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

    .made { display: flex; align-items: center; gap: 7px; min-height: 24px; font-size: 12px; color: var(--muted); text-decoration: none; }
    .made:hover { color: var(--accent); }
    .made:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    .made img { width: 18px; height: 18px; }
    .error { color: var(--danger); background: var(--card); padding: 16px 20px; border-radius: 14px; max-width: 480px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .25); }
    @media (max-width: 600px) {
      .wrap { padding: 0; gap: 0; justify-content: flex-start; }
      .bar { max-width: none; height: 48px; flex: none; padding: 0 6px; box-sizing: border-box; background: var(--card);
        border-bottom: 1px solid var(--line); }
      #chat, [data-embedded] #chat { flex: 1; min-height: 0; height: auto; max-width: none; border-radius: 0; box-shadow: none; }
      .made { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { #chat, .bar { animation: none; } .bar-btn svg { transition: none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="sr-only" id="chat-title">Chat con un agente de Lince</h1>
    <nav class="bar" aria-label="Página">
      <a class="bar-btn back" id="back" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Volver</a>
      <button class="bar-btn theme" id="theme" type="button" aria-label="Cambiar tema claro u oscuro" title="Cambiar tema">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
    <div id="chat"></div>
    <a class="made" href="/" title="Abrir Lince"><img src="favicon.svg" alt="" width="18" height="18">Hecho con Lince</a>
  </main>
  <script src="js/chat-page.js" defer></script>
</body>
</html>
