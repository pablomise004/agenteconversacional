<html lang="es">
<head>

  <meta name="theme-color" content="#f7f7f8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

      const t = localStorage.getItem("agente.theme");

  </script>

  <div id="app" class="app">
    <noscript><p style="padding:20px">Esta consola necesita JavaScript.</p></noscript>
