<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión · Lince</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f7f7f8; --panel: #fff; --text: #16171b; --muted: #5f6471; --border: #e7e8eb; --primary: #4f46e5;
      --glow-1: rgba(91, 92, 246, .16); --glow-2: rgba(150, 69, 238, .12); color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --panel: #191919; --text: #ececec; --muted: #a3a3a3; --border: #2a2a2a; --primary: #5558e8;
        --glow-1: rgba(91, 92, 246, .14); --glow-2: rgba(150, 69, 238, .1); color-scheme: dark; }
    }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 16px; box-sizing: border-box; color: var(--text);
      font: 15px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: radial-gradient(800px 480px at 10% -10%, var(--glow-1), transparent 60%),
                  radial-gradient(700px 480px at 100% 110%, var(--glow-2), transparent 60%), var(--bg); }
    main { max-width: 440px; padding: 32px 28px; border-radius: 20px; background: var(--panel); border: 1px solid var(--border);
      box-shadow: 0 24px 56px -12px rgba(16, 18, 27, .22); text-align: center; animation: in .5s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } }
    img { width: 56px; height: 56px; }
    h1 { font-size: 21px; line-height: 1.3; margin: 16px 0 8px; letter-spacing: -.01em; }
    p { margin: 0 0 12px; color: var(--muted); }
    a { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 18px; margin-top: 8px;
      border-radius: 10px; background: var(--primary); color: #fff; font-weight: 600; text-decoration: none; }
    a:hover { filter: brightness(1.08); }
    a:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="">
    <h1>No hay conexión con el servidor de Lince</h1>
    <p>Los agentes y el modelo están en el servidor, así que sin él la consola no puede abrirse.</p>
    <p>Comprueba tu conexión a Internet o, si usas Lince en tu ordenador, que siga abierta la ventana de <b>iniciar.bat</b>.</p>
    <a href="/">Volver a intentarlo</a>
  </main>
</body>
</html>
